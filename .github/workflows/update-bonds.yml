name: Update bonds

# Government bond yields for every country on the site (US, Switzerland, Germany,
# UK, Japan, France, Italy, Spain, Netherlands, Canada, Australia, China, India,
# South Korea, Brazil), plus five years of history for the charts.
#
# This is the same job that runs every hour inside "Update other markets"; it's
# here on its own so you can run just the bonds whenever you like, from the
# Actions tab → Update bonds → Run workflow.
on:
  workflow_dispatch:
    inputs:
      history:
        description: "Also rebuild the 5-year history for the charts"
        type: boolean
        default: true

concurrency:
  group: update-bonds
  cancel-in-progress: true

jobs:
  bonds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Optional. CNBC covers every country without it; FRED only fills gaps.
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Sovereign bond yields
        run: |
          if [ "${{ inputs.history }}" = "true" ]; then
            python scripts/update_bonds.py --years 5
          else
            python scripts/update_bonds.py --years 1 --no-history
          fi
