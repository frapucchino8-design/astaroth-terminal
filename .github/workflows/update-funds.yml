name: Update ETFs and futures

on:
  schedule:
    # Every weeknight at 21:42 UTC, before the big US stock job.
    - cron: "42 21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: funds
  cancel-in-progress: false

jobs:
  funds:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Update ETFs and futures
        run: python scripts/update_funds.py --budget-minutes 90
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # FFO/AFFO only move once a quarter, so a short budget each night is plenty:
      # it works oldest-first and comes back round to everything within a week.
      - name: Rebuild REIT FFO and AFFO
        run: python scripts/update_reits.py --budget-minutes 20
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
