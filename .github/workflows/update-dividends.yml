name: Update dividends and price changes

# Fills the two sets of columns the Dividend and Price change screeners need:
#   update_dividends.py → dividend growth over 1 / 3 / 5 / 10 years, dividend streak
#   update_returns.py   → price change over 1M / 2M / 3M / 6M / YTD / 2Y / 3Y
#
# Run these once in the Supabase SQL editor before the first run:
#   supabase/migration_dividends.sql
#   supabase/migration_returns.sql
# Both scripts check, and stop with a clear message if a column is missing.
#
# Dividends change a few times a year, price changes every day — so dividends
# run weekly and returns daily. The first dividend run does every payer in the
# database; after that --stale-days 25 means each run only picks up what has
# gone stale, which keeps it well inside the time limit.
on:
  schedule:
    - cron: "17 06 * * 0"      # Sunday 06:17 UTC — dividends and returns
    - cron: "47 22 * * 1-5"    # weekday evenings 22:47 UTC — returns only
  workflow_dispatch:
    inputs:
      what:
        description: "Which to run"
        type: choice
        options: [both, dividends, returns]
        default: both
      full:
        description: "Redo everything, ignoring what was updated recently"
        type: boolean
        default: false

concurrency:
  group: dividends-returns
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # the weekday schedule is returns-only; everything else follows the input
      WHAT: ${{ github.event.schedule == '47 22 * * 1-5' && 'returns' || inputs.what || 'both' }}
      STALE: ${{ inputs.full && '0' || '25' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt

      - name: Dividend growth and streaks
        if: env.WHAT != 'returns'
        run: python scripts/update_dividends.py --stale-days $STALE --deadline 2100

      - name: Price changes
        if: env.WHAT != 'dividends'
        run: python scripts/update_returns.py --stale-days ${{ inputs.full && '0' || '1' }} --deadline 1500
