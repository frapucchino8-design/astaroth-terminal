name: Update corporate bonds

# Individual company bonds for the Public section, from the holdings of two big
# iShares ETFs (LQD = investment grade, HYG = high yield). BlackRock refreshes
# these once a day, so this runs daily. No API key.
#
# Run supabase/migration_corporate_bonds.sql once before the first run.
on:
  schedule:
    - cron: "37 11 * * 1-5"      # weekdays 11:37 UTC (after BlackRock posts the file)
  workflow_dispatch:
    inputs:
      only:
        description: "Just one ETF (LQD or HYG); blank = both"
        default: ""

concurrency:
  group: update-corpbonds
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  corpbonds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: iShares corporate bond holdings
        run: python scripts/update_corpbonds.py ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
