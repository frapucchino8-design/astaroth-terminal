name: Update stock data

on:
  schedule:
    # 22:17 UTC on weekdays (23:17 Zurich in winter), after the US market closes.
    - cron: "17 22 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "Which market to update"
        type: choice
        options: [all, us, switzerland, etfs, futures, indices, crypto, fx, eurex]
        default: all

env:
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  us:
    if: ${{ github.event_name == 'schedule' || inputs.market == 'all' || inputs.market == 'us' }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Update US stocks (Finnhub)
        run: python scripts/update_us.py --budget-minutes 320

  switzerland:
    if: ${{ github.event_name == 'schedule' || inputs.market == 'all' || inputs.market == 'switzerland' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_ch.py

  etfs:
    if: ${{ github.event_name == 'schedule' || inputs.market == 'all' || inputs.market == 'etfs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_etfs.py

  futures:
    if: ${{ github.event_name == 'schedule' || inputs.market == 'all' || inputs.market == 'futures' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_futures.py

  indices:
    if: ${{ github.event_name == 'schedule' || inputs.market == 'all' || inputs.market == 'indices' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_indices.py

  crypto:
    if: ${{ github.event_name == 'schedule' || inputs.market == 'all' || inputs.market == 'crypto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_crypto.py

  fx:
    if: ${{ github.event_name == 'schedule' || inputs.market == 'all' || inputs.market == 'fx' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_fx.py

  eurex:
    if: ${{ github.event_name == 'schedule' || inputs.market == 'all' || inputs.market == 'eurex' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true   # best-effort: the Deutsche Börse file service may not be reachable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_eurex.py
