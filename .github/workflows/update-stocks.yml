name: Update stock data

on:
  schedule:
    # Weekdays at 22:17 UTC (23:17 in Zurich in winter), after the US market closes.
    - cron: "17 22 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "Which market to update"
        type: choice
        options: [both, us, switzerland]
        default: both

jobs:
  us:
    if: ${{ github.event_name == 'schedule' || inputs.market != 'switzerland' }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Update US stocks (Finnhub)
        run: python scripts/update_us.py --budget-minutes 320
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  switzerland:
    if: ${{ github.event_name == 'schedule' || inputs.market != 'us' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Update Swiss stocks (Yahoo Finance)
        run: python scripts/update_ch.py
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
