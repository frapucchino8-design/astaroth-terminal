name: Update market indicators

# Market-sentiment gauges for the Public section. Today that's the CNN Fear &
# Greed Index, which moves through the US trading day — so this runs every two
# hours. No API key.
#
# Run supabase/migration_indicators.sql once before the first run.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

concurrency:
  group: update-indicators
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  indicators:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: CNN Fear & Greed
        run: python scripts/update_feargreed.py
