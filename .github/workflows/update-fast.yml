name: Fast refresh (every 5 min, market hours)

# Runs every 5 minutes between 07:00 and 21:55 UTC, Monday to Friday. The window
# covers both DST and non-DST versions of the US and Swiss market days.
#
# Each asset class runs in its own parallel job, so one slow or failing step
# never pushes the whole run over the 5-minute timeout.
on:
  schedule:
    - cron: "*/5 7-21 * * 1-5"
  workflow_dispatch:
    inputs:
      what:
        description: "Which fast jobs to run"
        type: choice
        options: [all, swiss, futures, indices, crypto, fx, eurex]
        default: all

# One tick at a time: if a run is still finishing when the next cron fires,
# the newer one waits, so we never write stale snapshots over fresh ones.
concurrency:
  group: fast-refresh
  cancel-in-progress: false

env:
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  swiss:
    if: ${{ github.event_name == 'schedule' || inputs.what == 'all' || inputs.what == 'swiss' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_ch_prices.py --deadline 330

  futures:
    if: ${{ github.event_name == 'schedule' || inputs.what == 'all' || inputs.what == 'futures' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_futures.py --fast

  indices:
    if: ${{ github.event_name == 'schedule' || inputs.what == 'all' || inputs.what == 'indices' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_indices.py --fast

  crypto:
    if: ${{ github.event_name == 'schedule' || inputs.what == 'all' || inputs.what == 'crypto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_crypto.py

  fx:
    if: ${{ github.event_name == 'schedule' || inputs.what == 'all' || inputs.what == 'fx' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_fx.py --fast

  eurex:
    if: ${{ github.event_name == 'schedule' || inputs.what == 'all' || inputs.what == 'eurex' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      # --fast skips the per-contract daily-history download (22 extra large CSVs),
      # which is what pushed this job past the 5-minute timeout.
      - run: python scripts/update_eurex.py --fast --deadline 210
