name: Fast refresh (every 5 min, market hours)

# Runs every 5 minutes between 07:00 and 21:55 UTC, Monday to Friday. The window
# covers both DST and non-DST versions of the US and Swiss market days.
#
# GitHub Actions schedules its 5-minute crons on a best-effort basis — the runner
# queue can delay a tick by 5–15 minutes under load. For true 5-minute cadence,
# point a free pinger such as cron-job.org at the "workflow_dispatch" endpoint.
on:
  schedule:
    - cron: "*/5 7-21 * * 1-5"
  workflow_dispatch:
    inputs:
      what:
        description: "Which fast jobs to run"
        type: choice
        options: [all, prices, swiss, futures, indices, crypto, fx, eurex]
        default: all

# Only one run at a time: if a tick is still finishing when the next fires,
# the newer one waits, so we never write stale snapshots over fresh ones.
concurrency:
  group: fast-refresh
  cancel-in-progress: false

env:
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  # All the fast jobs run inside a single runner, so GitHub only has to spin
  # one container up every 5 minutes. Each step is independent — a Yahoo hiccup
  # on one asset class doesn't stop the others.
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt

      - name: Swiss prices
        if: ${{ github.event_name == 'schedule' || inputs.what == 'all' || inputs.what == 'swiss' || inputs.what == 'prices' }}
        continue-on-error: true
        run: python scripts/update_ch_prices.py

      - name: Futures
        if: ${{ github.event_name == 'schedule' || inputs.what == 'all' || inputs.what == 'futures' || inputs.what == 'prices' }}
        continue-on-error: true
        run: python scripts/update_futures.py

      - name: Indices
        if: ${{ github.event_name == 'schedule' || inputs.what == 'all' || inputs.what == 'indices' || inputs.what == 'prices' }}
        continue-on-error: true
        run: python scripts/update_indices.py

      - name: Crypto
        if: ${{ github.event_name == 'schedule' || inputs.what == 'all' || inputs.what == 'crypto' || inputs.what == 'prices' }}
        continue-on-error: true
        run: python scripts/update_crypto.py

      - name: FX
        if: ${{ github.event_name == 'schedule' || inputs.what == 'all' || inputs.what == 'fx' || inputs.what == 'prices' }}
        continue-on-error: true
        run: python scripts/update_fx.py

      - name: Eurex (best effort)
        if: ${{ github.event_name == 'schedule' || inputs.what == 'all' || inputs.what == 'eurex' || inputs.what == 'prices' }}
        continue-on-error: true
        run: python scripts/update_eurex.py
